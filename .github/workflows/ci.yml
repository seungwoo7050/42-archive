name: IRC 회귀 검사

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform-regression:
    name: ${{ matrix.os }} 빌드와 회귀
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 경고를 오류로 처리하여 빌드
        run: make -j2

      - name: 단위 및 네트워크 회귀 실행
        run: make test

  linux-sanitizers:
    name: Linux ASan·UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SANITIZER_FLAGS: >-
        -std=c++17 -Wall -Wextra -Werror -g -O1
        -fno-omit-frame-pointer -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: ASan·UBSan 빌드
        run: make -j2 CXXFLAGS="${SANITIZER_FLAGS}"

      - name: 새니타이저 단위 및 네트워크 회귀 실행
        run: make test CXXFLAGS="${SANITIZER_FLAGS}"
